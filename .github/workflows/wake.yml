name: Wake Streamlit App
on:
  schedule:
    - cron: "0 */4 * * *"   # 4시간마다 실행
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python main.py
