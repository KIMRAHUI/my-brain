name: sync-notion-to-github

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-github-sync
  cancel-in-progress: false

jobs:
  sync-and-generate:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 체크아웃 (기존 파일들과 충돌 안 나게 clean 옵션을 false로 주거나, 안전하게 진행)
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      # 2. Git 기본 설정
      - name: Set up Git Identity
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # 3. 파이썬 환경 설정 및 의존성 설치
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install notion-client

      # 4. 노션 새 페이지 스텁 생성 스크립트 실행
      - name: Generate empty md stubs for new Notion pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/generate_md_stubs.py

      # 5. 변경된 파일들을 안전하게 추가하고 푸시 (Git Pull 충돌 원천 차단)
      - name: Commit and push changes
        run: |
          git add -A
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync Notion pages" && git push origin main)
