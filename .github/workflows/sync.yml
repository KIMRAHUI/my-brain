name: sync-notion-to-github

on:
  schedule:
    - cron: '0 0 * * *'    # 매일 00:00 UTC 자동 동기화
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼
  push:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # git push 권한 부여
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install notion-client

      - name: Generate empty md stubs for new Notion pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/generate_md_stubs.py

      - name: Commit new stub files
        run: |
          git config user.name "notion-bot"
          git config user.email "bot@example.com"
          
          # 1. 생성된 스텁 파일을 먼저 스테이징 및 로컬 커밋 (변경사항 없으면 건너뜀)
          git add notion/
          git commit -m "chore: add new notion page stubs" || echo "No new stubs to commit"
          
          # 2. 원격 저장소의 최신 내역을 안전하게 Rebase로 가져와 병합
          git pull --rebase origin main
          
          # 3. 충돌 없는 깨끗한 상태로 최종 푸시
          git push origin main
  sync:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Notion-GitHub-Sync 액션도 커밋/푸시하므로 필요
    steps:
      - name: Checkout repo (latest main, including new stubs)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync Notion content into stub files
        uses: YouXam/Notion-GitHub-Sync@v2
        with:
          notion_token: ${{ secrets.NOTION_TOKEN }}
          subdir: true   # notion/{page_id}/index.md 형태로 저장
