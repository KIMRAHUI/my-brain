name: sync-notion-to-github

on:
  schedule:
    - cron: '0 0 * * *'    # 매일 00:00 UTC 자동 동기화
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼
  push:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # git push 권한 부여
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 전체 히스토리를 가져와 rebase 안정성 확보

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install notion-client

      - name: Generate empty md stubs for new Notion pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/generate_md_stubs.py

      - name: Commit new stub files
        run: |
          git config user.name "notion-bot"
          git config user.email "bot@example.com"
          git add .
          git commit -m "chore: update notion stubs and sync files" || echo "No changes to commit"
          
          # [충돌 방지 핵심] 푸시 직전 원격 저장소의 최신 커밋을 Rebase로 안전하게 병합
          git pull origin main --rebase || echo "No remote changes to pull"
          
          git push

  sync:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Notion-GitHub-Sync 액션 커밋/푸시 권한
    steps:
      - name: Checkout repo (latest main, including new stubs)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync Notion content into stub files
        uses: YouXam/Notion-GitHub-Sync@v2
        with:
          notion_token: ${{ secrets.NOTION_TOKEN }}
          subdir: true       # notion/{page_id}/index.md 형태로 저장
