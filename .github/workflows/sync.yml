name: sync-notion-to-github

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-github-sync
  cancel-in-progress: false

jobs:
  sync-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install notion-client

      - name: Generate empty md stubs for new Notion pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/generate_md_stubs.py

      - name: Sync Notion content into stub files
        uses: YouXam/Notion-GitHub-Sync@v2
        with:
          notion_token: ${{ secrets.NOTION_TOKEN }}
          subdir: true

      - name: Commit and push
        run: |
          git config user.name "notion-bot"
          git config user.email "bot@example.com"

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: sync notion pages"

          git fetch origin main
          git rebase origin/main

          git push origin main
