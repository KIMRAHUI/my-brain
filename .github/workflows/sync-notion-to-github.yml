name: sync-notion-to-github

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install notion-client

      - name: Generate empty md stubs for new Notion pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/generate_md_stubs.py

      - name: Commit and push changes safely
        run: |
          git config user.name "notion-bot"
          git config user.email "bot@example.com"
          
          git add notion/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore: sync notion pages"
          
          # 원격 저장소 최신 상태 먼저 반영 후 안전하게 푸시
          git fetch origin main
          git rebase origin/main || git rebase --abort
          git push origin main
